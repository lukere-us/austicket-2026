<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NZ LANKA TICKETS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    width: 1200px;
    height: 480px;
    overflow: hidden;
  }
  #capture {
    width: 1200px;
    height: 480px;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
  }

  /* Same display style as AUS LANKA reference */
  .brand {
    display: flex;
    align-items: flex-end;
    color: #F5D800;
    font-family: "Anton", Impact, "Arial Black", sans-serif;
    font-size: 120px;
    line-height: 0.85;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    height: 110px;
  }
  .brand span.letter {
    display: inline-block;
  }
  /* Chevron A matching original (no crossbar) */
  .brand .chevron-a {
    position: relative;
    width: 0.68em;
    height: 0.88em;
    margin: 0 0.01em 0.02em;
  }
  .brand .chevron-a i,
  .brand .chevron-a b {
    position: absolute;
    top: 0;
    width: 0.16em;
    height: 100%;
    background: #F5D800;
  }
  .brand .chevron-a i {
    left: 0.1em;
    transform: skewX(-21deg);
    transform-origin: top center;
  }
  .brand .chevron-a b {
    right: 0.1em;
    transform: skewX(21deg);
    transform-origin: top center;
  }

  .ticket {
    position: relative;
    background: #F5D800;
    color: #1A2656;
    font-family: "Anton", Impact, "Arial Black", sans-serif;
    font-size: 48px;
    letter-spacing: 0.5em;
    padding: 16px 70px 18px 48px;
    line-height: 1;
  }
  .ticket::before,
  .ticket::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 26px;
    height: 26px;
    background: #000;
    border-radius: 50%;
    transform: translateY(-50%);
  }
  .ticket::before { left: -13px; }
  .ticket::after { right: -13px; }
</style>
</head>
<body>
  <div id="capture">
    <div class="brand" aria-label="NZ LANKA">
      <span class="letter">NZ L</span><span class="chevron-a" aria-hidden="true"><i></i><b></b></span><span class="letter">NK</span><span class="chevron-a" aria-hidden="true"><i></i><b></b></span>
    </div>
    <div class="ticket">TICKETS</div>
  </div>
</body>
</html>
